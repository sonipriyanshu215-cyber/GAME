<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow Heist">
<meta name="description" content="Shadow Heist - a stealth logic puzzle game that trains planning and concentration. 117 levels, works offline, no ads.">
<title>Shadow Heist</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <section id="s-landing" class="screen active">
    <div class="bg-float" aria-hidden="true"></div>
    <button id="pf-chip" class="chip" aria-label="Switch player"></button>
    <div class="hero">
      <div class="logo-emoji" aria-hidden="true">🥷</div>
      <h1>Shadow <span>Heist</span></h1>
      <p class="tag">Think. Plan. Sneak.</p>
    </div>
    <div id="prog" class="card"></div>
    <div class="menu">
      <button id="b-play" class="btn big primary"></button>
      <div class="row2">
        <button id="b-levels" class="btn">🗺️ Levels</button>
        <button id="b-daily" class="btn">🎯 Daily</button>
      </div>
      <div class="row2">
        <button id="b-brain" class="btn">🧠 Brain Gym</button>
        <button id="b-howto" class="btn">❓ How to play</button>
      </div>
      <div class="row2">
        <button id="b-settings" class="btn">⚙️ Settings</button>
        <button id="b-install" class="btn" hidden>📲 Install</button>
      </div>
    </div>
    <p class="foot">Works offline &middot; No ads &middot; For all ages</p>
  </section>

  <!-- LEVEL MAP -->
  <section id="s-map" class="screen">
    <header class="topbar">
      <button id="m-back" class="icon" aria-label="Back">←</button>
      <h2>Choose a level</h2>
      <div class="pill" id="m-stars"></div>
    </header>
    <div id="map-body" class="scroll"></div>
  </section>

  <!-- GAME -->
  <section id="s-game" class="screen">
    <header class="hud">
      <button id="g-pause" class="icon" aria-label="Pause">☰</button>
      <div class="hud-mid"><div id="g-title"></div><div id="g-sub"></div></div>
      <button id="g-hint" class="icon hint" aria-label="Hint">💡<b id="g-hints">0</b></button>
    </header>
    <div class="stats"><span id="g-gems"></span><span id="g-moves"></span><span id="g-best"></span></div>
    <div id="board-wrap"><canvas id="board"></canvas><div id="board-msg"></div></div>
    <footer class="controls">
      <div class="acts">
        <button id="g-undo" class="btn sm">↶ Undo</button>
        <button id="g-wait" class="btn sm">⏳ Wait</button>
        <button id="g-restart" class="btn sm">⟳ Retry</button>
      </div>
      <div id="dpad" class="dpad" hidden>
        <i></i><button data-m="U" aria-label="Up">▲</button><i></i>
        <button data-m="L" aria-label="Left">◀</button><button data-m="W" aria-label="Wait">•</button><button data-m="R" aria-label="Right">▶</button>
        <i></i><button data-m="D" aria-label="Down">▼</button><i></i>
      </div>
    </footer>
  </section>

</div>

<div id="modal" class="modal-wrap" aria-live="polite"></div>
<div id="toast" role="status"></div>

<script src="/js/levels.js"></script>
<script src="/js/engine.js"></script>
<script src="/js/solver.js"></script>
<script src="/js/store.js"></script>
<script src="/js/audio.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/board.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
