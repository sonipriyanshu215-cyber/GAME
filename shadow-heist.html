<!DOCTYPE html>

<title>Shadow Heist</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0f1220;color:#e8ebff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom))}
.bar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;font-size:15px}
.bar span{flex:1;text-align:center}
button{font:inherit;color:#e8ebff;background:#252b4d;border:0;border-radius:12px;padding:10px 14px;font-weight:700}
button:active{background:#3a4280;transform:scale(.95)}
#wrap{flex:1;min-height:0;width:100%;max-width:460px;margin:6px 0}
canvas{width:100%;height:100%;display:block}
#ctl{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.act{display:flex;flex-direction:column;gap:8px;flex:1}
#dp{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
#dp button{padding:0;font-size:22px;border-radius:14px}
#ov{position:fixed;inset:0;background:rgba(10,12,28,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#ov h1{margin:0;font-size:34px}#ov p{margin:0;opacity:.85;max-width:320px;line-height:1.4}
#ov button{background:#ffcc4d;color:#222;font-size:18px;padding:12px 26px}
#menu{position:fixed;inset:0;background:rgba(10,12,28,.97);display:none;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 14px 14px;overflow-y:auto;touch-action:pan-y}
#gr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:420px;margin:12px 0}
#gr button{padding:12px 0;font-size:15px}#gr .dn{background:#2d6a4f}#gr .cu{outline:3px solid #ffcc4d}
#hint{font-size:12px;opacity:.6;margin-top:4px;text-align:center}
</style></head>

</div>

];
const $=id=>document.getElementById(id),cv=$("c"),x=cv.getContext("2d");
let lv=0,g,hist=[],best={},shake=0;
try{best=JSON.parse(localStorage.getItem("shadowheist")||"{}")}catch(e){}
const saveB=()=>{try{localStorage.setItem("shadowheist",JSON.stringify(best))}catch(e){}};
const k=(a,b)=>b*g.w+a;
function init(i){
 lv=(i+L.length)%L.length;const m=L[lv].m;const pp={};
 g={w:m[0].length,h:m.length,wall:new Set(),gems:new Set(),box:new Set(),gd:[],ice:new Set(),por:{},pic:{},p:null,e:null,moves:0,st:"play"};
 m.forEach((r,y)=>[...r].forEach((c,a)=>{
  if(c=="#")g.wall.add(k(a,y));
  else if(c=="~")g.ice.add(k(a,y));
  else if(c>="1"&&c<="9")(pp[c]=pp[c]||[]).push({x:a,y,c});
  else if(c=="*")g.gems.add(k(a,y));
  else if(c=="B")g.box.add(k(a,y));
  else if(c=="P")g.p={x:a,y};
  else if(c=="E")g.e={x:a,y};
  else if("hHvV".includes(c))g.gd.push({x:a,y,dx:c=="h"?1:c=="H"?-1:0,dy:c=="v"?1:c=="V"?-1:0});
 }));
 for(const c in pp){const v=pp[c];if(v.length==2){const A=k(v[0].x,v[0].y),B=k(v[1].x,v[1].y);g.por[A]=v[1];g.por[B]=v[0];g.pic[A]=g.pic[B]=c}}
 g.total=g.gems.size;hist=[];try{localStorage.setItem("shadowheist_last",lv)}catch(e){}$("ov").style.display="none";ui();fit();
}
const snap=()=>JSON.stringify({p:g.p,gems:[...g.gems],box:[...g.box],gd:g.gd,moves:g.moves});
function restore(s){s=JSON.parse(s);g.p=s.p;g.gems=new Set(s.gems);g.box=new Set(s.box);g.gd=s.gd;g.moves=s.moves;g.st="play";$("ov").style.display="none"}
const guardAt=(a,b)=>g.gd.some(o=>o.x==a&&o.y==b);
const solid=(a,b)=>g.wall.has(k(a,b))||g.box.has(k(a,b));
function step(dx,dy){
 if(g.st!="play")return;
 const s=snap(),px=g.p.x,py=g.p.y;let nx=px,ny=py;
 if(dx||dy){
  nx=px+dx;ny=py+dy;
  if(g.wall.has(k(nx,ny))){shake=6;return}
  if(g.box.has(k(nx,ny))){
   const bx=nx+dx,by=ny+dy;
   if(solid(bx,by)||g.gems.has(k(bx,by))||(bx==g.e.x&&by==g.e.y)||guardAt(bx,by)||g.por[k(bx,by)]){shake=6;return}
   g.box.delete(k(nx,ny));g.box.add(k(bx,by));
  }
  const q=g.por[k(nx,ny)];if(q){nx=q.x;ny=q.y}
 }
 hist.push(s);g.moves++;
 if(dx||dy){
  for(;;){g.gems.delete(k(nx,ny));g.p={x:nx,y:ny};if(guardAt(nx,ny))return lose();
   if(!g.ice.has(k(nx,ny)))break;const ax=nx+dx,ay=ny+dy;if(solid(ax,ay))break;nx=ax;ny=ay}
 }else g.gems.delete(k(nx,ny));
 if(!g.gems.size&&nx==g.e.x&&ny==g.e.y)return win();
 let caught=false;
 for(const o of g.gd){
  const ox=o.x,oy=o.y;
  let tx=ox+o.dx,ty=oy+o.dy;
  if(solid(tx,ty)){o.dx*=-1;o.dy*=-1;tx=ox+o.dx;ty=oy+o.dy;if(solid(tx,ty))continue}
  o.x=tx;o.y=ty;
  if((tx==nx&&ty==ny)||(tx==px&&ty==py&&ox==nx&&oy==ny))caught=true;
 }
 if(caught)return lose();
 ui();draw();
}
function undo(){if(hist.length){restore(hist.pop());ui();draw()}}
function lose(){g.st="lose";shake=14;buzz();ui();draw();ov("Busted! 🚨","A guard caught you. Think about the timing.","Undo last move",()=>undo())}
function win(){
 g.st="win";const b=best[lv];if(!b||g.moves<b)best[lv]=g.moves;saveB();ui();draw();
 const last=lv==L.length-1;
 ov(last?"Master Thief! 🏆":"Level clear! 🎉","Moves: "+g.moves+" · Best: "+best[lv],last?"Play again":"Next level",()=>init(lv+1));
}
function ov(h,p,b,f){$("oh").textContent=h;$("op").textContent=p;$("ob").textContent=b;$("ob").onclick=f;$("ov").style.display="flex"}
function buzz(){try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
function menu(){
 const gr=$("gr");gr.innerHTML="";
 L.forEach((l,i)=>{const b=document.createElement("button");b.textContent=(i+1)+(best[i]?" ✓":"");
  if(best[i])b.className="dn";if(i==lv)b.className+=" cu";
  b.onclick=()=>{$("menu").style.display="none";init(i)};gr.appendChild(b)});
 $("menu").style.display="flex";
}
function ui(){
 $("ti").textContent=L[lv].n;
 $("st").textContent="💎 "+(g.total-g.gems.size)+"/"+g.total+"  ·  Moves "+g.moves+(best[lv]?"  ·  Best "+best[lv]:"")+"  ·  "+L[lv].t;
}
function fit(){
 const r=$("wrap").getBoundingClientRect(),d=window.devicePixelRatio||1;
 cv.width=Math.max(10,r.width*d);cv.height=Math.max(10,r.height*d);draw();
}
function draw(){
 if(!g)return;
 const W=cv.width,H=cv.height,cs=Math.floor(Math.min(W/g.w,H/g.h)),ox=(W-cs*g.w)/2,oy=(H-cs*g.h)/2;
 x.clearRect(0,0,W,H);
 let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake--;requestAnimationFrame(draw)}
 x.save();x.translate(ox+sx,oy+sy);
 x.textAlign="center";x.textBaseline="middle";
 const ready=!g.gems.size;
 for(let b=0;b<g.h;b++)for(let a=0;a<g.w;a++){
  const w=g.wall.has(k(a,b));
  x.fillStyle=w?"#39407a":((a+b)%2?"#1b2040":"#202649");
  x.beginPath();x.roundRect(a*cs+1,b*cs+1,cs-2,cs-2,cs*.14);x.fill();
 }
 const em=(s,a,b,sc)=>{x.font=(cs*sc)+"px serif";x.fillText(s,a*cs+cs/2,b*cs+cs/2+cs*.04)};
 g.ice.forEach(i=>{x.fillStyle="rgba(120,210,255,.38)";x.fillRect((i%g.w)*cs+1,Math.floor(i/g.w)*cs+1,cs-2,cs-2);em("❄",i%g.w,Math.floor(i/g.w),.4)});
 for(const i in g.por)em(["🌀","🔮","🧿","🌐"][g.pic[i]-1]||"🌀",+i%g.w,Math.floor(+i/g.w),.7);
 x.globalAlpha=ready?1:.45;em("🚪",g.e.x,g.e.y,.75);x.globalAlpha=1;
 if(ready){x.strokeStyle="#ffcc4d";x.lineWidth=3;x.strokeRect(g.e.x*cs+3,g.e.y*cs+3,cs-6,cs-6)}
 g.gems.forEach(i=>em("💎",i%g.w,Math.floor(i/g.w),.7));
 g.box.forEach(i=>em("📦",i%g.w,Math.floor(i/g.w),.75));
 for(const o of g.gd){
  x.fillStyle="rgba(255,60,80,.25)";x.fillRect(o.x*cs+1,o.y*cs+1,cs-2,cs-2);
  em("👮",o.x,o.y,.72);
  em(o.dx>0?"➡️":o.dx<0?"⬅️":o.dy>0?"⬇️":"⬆️",o.x+o.dx*.38,o.y+o.dy*.38,.28);
 }
 em(g.st=="lose"?"😵":"🥷",g.p.x,g.p.y,.75);
 x.restore();
}
// input
const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener("keydown",e=>{
 const d=dirs[e.key];
 if(d){e.preventDefault();step(...d)}
 else if(e.key==" "){e.preventDefault();step(0,0)}
 else if(e.key=="z"||e.key=="u")undo();
 else if(e.key=="r")init(lv);
});
document.querySelectorAll("#dp button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();const[d,f]=b.dataset.d.split(",").map(Number);step(d,f)}));
$("un").onclick=undo;$("wt").onclick=()=>step(0,0);$("rs").onclick=()=>init(lv);
$("mn").onclick=menu;$("mc").onclick=()=>$("menu").style.display="none";
$("pv").onclick=()=>init(lv-1);$("nx").onclick=()=>init(lv+1);
let t0=null;
$("wrap").addEventListener("touchstart",e=>{t0=e.touches[0]},{passive:true});
$("wrap").addEventListener("touchend",e=>{
 if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;t0=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))<24)return step(0,0);
 Math.abs(dx)>Math.abs(dy)?step(dx>0?1:-1,0):step(0,dy>0?1:-1);
});
addEventListener("resize",fit);
let st0=0;try{st0=parseInt(localStorage.getItem("shadowheist_last"))||0}catch(e){}
init(st0<L.length?st0:0);
</script></body></html>
